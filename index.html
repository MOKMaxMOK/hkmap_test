<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HKT Map</title>
    <!-- 引入 MapLibre CSS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- 引入你的 CSS 檔案 -->
    <link href="./style.css" rel="stylesheet" />
</head>

<body>
    <div class="controls-bar">
        <div class="view-group">
            <div class="view-btn active" id="btn-map" onclick="switchView('map')">
                <span data-t="map">地圖</span>
            </div>
            <div class="view-btn" id="btn-list" onclick="switchView('list')">
                <span data-t="list">列表</span>
            </div>
        </div>
        <div class="divider"></div>
        <div class="filter-chip icon-only" onclick="openModal('lang')">🌐</div>
        <div class="filter-chip" onclick="openModal('category')"><span data-t="type">類型</span></div>
        <div class="filter-chip" onclick="openModal('region')"><span data-t="region">地區</span></div>
        <div class="filter-chip icon-only" onclick="openModal('about-menu')">ℹ️</div>
    </div>

    <div id="main-container">
        <div id="map"></div>

        <div class="legend-group is-expanded" id="legend-drag">
            <div class="legend-btn" id="legend-btn">❓</div>
            <div class="legend-card" id="legend-card">
                <div class="legend-close" id="legend-close-btn">✕</div>
                <div id="legend-content"></div>
            </div>
        </div>

        <div id="list-view"></div>

        <div id="about-site-view" class="page-view">
            <div class="page-content">
                <div class="page-header">
                    <h1 data-t="aboutSiteTitle">關於網站</h1>
                    <p data-t="siteIntro"></p>
                </div>
                <div class="changelog-section">
                    <h2 data-t="changelog">更新日誌</h2>
                    <div id="changelog-list"></div>
                </div>
            </div>
        </div>

        <div id="contact-view" class="page-view">
            <div class="page-content">
                <div class="page-header">
                    <h1 data-t="contactTitle">聯絡我們</h1>
                    <p data-t="teamIntro"></p>
                </div>
                <div class="contact-grid">
                    <a href="#" id="mail-tech" class="contact-card">
                        <div class="card-icon">🔧</div>
                        <div class="card-title" data-t="techSupport"></div>
                        <div class="card-desc" data-t="techDesc"></div>
                        <div class="card-btn" data-t="sendEmail"></div>
                    </a>
                    <a href="#" id="mail-biz" class="contact-card highlight">
                        <div class="card-icon">💼</div>
                        <div class="card-title" data-t="bizInquiry"></div>
                        <div class="card-desc" data-t="bizDesc"></div>
                        <div class="card-btn" data-t="sendEmail"></div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="overlay" onclick="closeModal()"></div>
    <div class="modal-card" id="modal-lang">
        <div class="modal-header">
            <span data-t="selectLang">選擇語言</span>
            <span class="header-btn" onclick="closeModal()">✕</span>
        </div>
        <div class="modal-body" id="lang-list"></div>
    </div>
    <div class="modal-card" id="modal-category">
        <div class="modal-header">
            <span class="header-btn" onclick="toggleAll('category',true)" data-t="all">全選</span>
            <span data-t="type">類型</span>
            <span class="header-btn" onclick="toggleAll('category',false)" data-t="none">清空</span>
        </div>
        <div class="modal-body" id="cat-list"></div>
    </div>
    <div class="modal-card" id="modal-region">
        <div class="modal-header">
            <span class="header-btn" onclick="toggleAll('region',true)" data-t="all">全選</span>
            <span data-t="region">地區</span>
            <span class="header-btn" onclick="toggleAll('region',false)" data-t="none">清空</span>
        </div>
        <div class="modal-body">
            <div class="macro-panel">
                <div class="panel-title" data-t="quickSelect">大區快捷</div>
                <div class="chip-grid" id="macro-list"></div>
            </div>
            <div id="region-list"></div>
        </div>
    </div>
    <div class="modal-card" id="modal-about-menu" style="width:80%;max-width:300px;">
        <div class="about-menu-item" onclick="switchView('contact')">
            <span class="about-icon">📞</span><span data-t="contactTitle">聯絡我們</span>
        </div>
        <div class="about-menu-item" onclick="switchView('aboutSite')">
            <span class="about-icon">💻</span><span data-t="aboutSiteTitle">關於網站</span>
        </div>
    </div>
    <div class="modal-card" id="modal-spot-detail" style="background:transparent;box-shadow:none;padding:10px;">
        <div id="spot-detail-content"></div>
    </div>

    <!-- 引入 MapLibre JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="./data.js"></script>
    <!-- 引入你的 JS 檔案 (注意：不加 type="module") -->
    <script src="./script.js"></script>
</body>

</html>
